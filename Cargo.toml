[package]
name = "bgp-looking-glass-rs"
version = "0.1.6"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

hyper = { version = "1.12.0", features = ["full"] }
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
log = "0.4.35"
env_logger = "0.11.11"
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors"] }
regex = "1.13.1"
menhera-inet = "0.1.1"
parking_lot = "0.13.0"
reqwest = "0.13.5"
openssl-sys = { version = "0.9.118", features = ["vendored"] }
